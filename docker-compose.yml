version: '3.8'

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: dataopsgpt-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: dataopsgpt-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres:
    image: postgres:15
    container_name: dataopsgpt-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dataopsgpt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: dataopsgpt-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5
    container_name: dataopsgpt-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data

  prometheus:
    image: prom/prometheus
    container_name: dataopsgpt-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    container_name: dataopsgpt-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  backend:
    build: ./backend
    container_name: dataopsgpt-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres123@postgres:5432/dataopsgpt
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
      - JWT_SECRET=change_this_secret
      - LLM_PROVIDER=groq
      - GROQ_API_KEY=gsk_xxxxx
      - GEMINI_API_KEY=AIzaSyxxxxx
      - GEMINI_MODEL=gemini-2.0-flash
      - MODEL=llama-3.3-70b-versatile
    depends_on:
      - postgres
      - kafka
      - qdrant
      - neo4j

  frontend:
    build: ./frontend
    container_name: dataopsgpt-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  kafka-data:
  zookeeper-data:
  qdrant_data:
  neo4j_data:
  postgres_data: